<g class="ttc-st">
<text class="ttc-rd" x="704.4" y="127.1" transform="rotate(-11.8 704.4 127.1)" text-anchor="middle" paint-order="stroke" stroke="#131d28" stroke-linejoin="round">EAST HOUSTON ST</text>
