<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1197 660" width="100%" role="img" aria-label="Course map for the Coyoteville 1st Annual Turkey Trot. The route starts and finishes at Coyoteville on North Stadium Road in Alice, Texas, runs out along East Houston Street and returns along Sain Drive.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1e2d3d"/><stop offset="1" stop-color="#131d28"/></linearGradient>
<linearGradient id="rt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2a541"/><stop offset=".5" stop-color="#e8541f"/><stop offset="1" stop-color="#f2a541"/></linearGradient>
<filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="trail"><stop offset="0" stop-color="#f7f0de" stop-opacity=".9"/><stop offset="1" stop-color="#f7f0de" stop-opacity="0"/></radialGradient>
<path id="course" d="M 508.9,426.9 L 493.9,348.9 L 475.9,246.9 L 379.8,306.9 L 104.0,528.9 L 232.9,555.8 L 379.8,528.9 L 530.4,509.4 L 778.9,447.9 L 893.1,438.7 L 1031.2,393.9 L 1093.4,379.4 L 913.9,124.0 L 757.6,159.9 L 511.4,208.4 L 475.9,246.9 L 493.9,348.9 L 508.9,426.9"/>
</defs>
<rect width="1197" height="660" fill="url(#bg)"/>
<g class="grid" stroke="#54708c" stroke-opacity=".16" stroke-width="1">
<line x1="0" y1="0" x2="0" y2="660"/>
<line x1="58" y1="0" x2="58" y2="660"/>
<line x1="116" y1="0" x2="116" y2="660"/>
<line x1="174" y1="0" x2="174" y2="660"/>
<line x1="232" y1="0" x2="232" y2="660"/>
<line x1="290" y1="0" x2="290" y2="660"/>
