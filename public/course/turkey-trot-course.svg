</g>
<g transform="translate(1145,56)"><path d="M 0,-26 L 10,11 L 0,3.5 L -10,11 Z" fill="#f7f0de" fill-opacity=".75"/></g>
<style>
.ttcourse text { font-family: Arial, Helvetica, sans-serif; }
.ttc-rd  { font-size: 17px; letter-spacing: 3.5px; stroke-width: 7px; fill: #f7f0de; fill-opacity: .62; }
.ttc-sf  { font-size: 24px; font-weight: 900; letter-spacing: 1.5px; stroke-width: 7px; fill: #f7f0de; font-family: "Arial Black", Arial, sans-serif; }
.ttc-sub { font-size: 16px; stroke-width: 6px; fill: #f2a541; }
.ttc-h1  { font-size: 28px; font-weight: 900; letter-spacing: 1.5px; font-family: "Arial Black", Arial, sans-serif; }
.ttc-h2  { font-size: 17px; }
.ttc-mob { display: none; }
@media (max-width: 760px) {
  .ttc-dsk { display: none; }
  .ttc-mob { display: inline; }
  .ttc-rd  { font-size: 44px; letter-spacing: 1px; stroke-width: 14px; fill-opacity: .72; }
  .ttc-sf  { font-size: 48px; stroke-width: 15px; letter-spacing: 0; }
  .ttc-sub { font-size: 42px; stroke-width: 13px; }
  .ttc-h1  { font-size: 60px; }
  .ttc-h2  { font-size: 40px; }
}
/* Default with no JavaScript: the map is DRAWN. Never hide the content
   behind an animation. .ttc-armed is added by script on mount, which is
   the only thing that may hide the line, and .ttc-draw then draws it. */
.ttc-armed .ttc-route { stroke-dashoffset: 2622; }
.ttc-armed .ttc-flow,
.ttc-armed .ttc-pin,
.ttc-armed .ttc-runner { opacity: 0; }
.ttc-armed.ttc-draw .ttc-route { animation: ttcDraw 3.2s cubic-bezier(.45,.05,.3,1) .1s forwards; }
.ttc-armed.ttc-draw .ttc-flow  { animation: ttcFade .8s linear 3.2s forwards, ttcFlow 1.9s linear 3.2s infinite; }
.ttc-armed.ttc-draw .ttc-pin   { animation: ttcFade .7s ease-out 3.0s forwards; }
.ttc-pulse { animation: ttcPulse 2.6s ease-out 1s infinite; }
@keyframes ttcDraw  { to { stroke-dashoffset: 0; } }
@keyframes ttcFade  { to { opacity: 1; } }
@keyframes ttcFlow  { to { stroke-dashoffset: -280; } }
@keyframes ttcPulse { 0% { r:22; stroke-opacity:.85 } 70%,100% { r:48; stroke-opacity:0 } }
@media (prefers-reduced-motion: reduce) {
  .ttc-armed .ttc-route { stroke-dashoffset: 0; animation: none; }
  .ttc-armed .ttc-flow, .ttc-armed .ttc-pin { opacity: 1; animation: none; }
  .ttc-pulse { animation: none; }
}
</style>
</svg>