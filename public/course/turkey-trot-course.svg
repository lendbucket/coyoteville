<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1197 660" width="100%" class="ttcourse" role="img" aria-label="Course map for the Coyoteville 1st Annual Turkey Trot 5K. The route starts and finishes at Coyoteville on North Stadium Road in Alice, Texas, runs out along East Houston Street and returns along Sain Drive.">
<defs>
<linearGradient id="ttcBg" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1e2d3d"/><stop offset="1" stop-color="#131d28"/></linearGradient>
<linearGradient id="ttcLine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2a541"/><stop offset=".5" stop-color="#e8541f"/><stop offset="1" stop-color="#f2a541"/></linearGradient>
<filter id="ttcGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="ttcTrail"><stop offset="0" stop-color="#f7f0de" stop-opacity=".9"/><stop offset="1" stop-color="#f7f0de" stop-opacity="0"/></radialGradient>
</defs>
